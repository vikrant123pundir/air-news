<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Lexical Precision Dictator - V64</title>
    <style>
        :root { --grey: #94a3b8; --accent: #3b82f6; --bg: #050505; --card: #121212; --text: #fafafa; --yellow: #fbbf24; --red: #ef4444; --green: #10b981; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .header-controls { flex-shrink: 0; background: #000; border-bottom: 1px solid #222; padding: 10px; z-index: 100; }
        .wrapper { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

        textarea#textInput { width: 100%; height: 50px; background: var(--card); border: 1px solid #333; border-radius: 8px; color: white; padding: 10px; resize: none; font-size: 0.85rem; outline: none; box-sizing: border-box; }

        .controls { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 8px; align-items: stretch; }

        .card { background: var(--card); padding: 6px 12px; border-radius: 8px; border: 1px solid #262626; height: 75px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }

        .hud-static { font-size: 1.8rem; font-weight: 800; color: var(--accent); text-align: center; font-family: 'Monaco', monospace; line-height: 1; margin-top: 4px; }

        label { display: block; font-size: 0.55rem; color: #888; font-weight: 700; text-transform: uppercase; text-align: center; transition: color 0.2s; }
        .label-bg-on { color: var(--red) !important; text-decoration: underline; text-underline-offset: 3px; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; margin-bottom: 4px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: #222; border-radius: 4px; border: 1px solid #333; }
        input[type=range]::-webkit-slider-thumb { height: 20px; width: 40px; border-radius: 4px; background: var(--accent); cursor: pointer; -webkit-appearance: none; margin-top: -7px; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }

        select { background: #1a1a1a; color: var(--accent); border: 1px solid #333; font-size: 0.75rem; outline: none; cursor: pointer; width: 100%; font-weight: bold; padding: 2px; border-radius: 4px; margin-top: 10px; }

        .display-box { position: relative; text-align: center; padding: 14px 12px 8px; background: #1a1a1a; border-radius: 12px; border: 1px solid var(--accent); margin: 2px 0; }
        #phrase { padding: 0 34px; box-sizing: border-box; min-height: 1.7em; }
        #phWrap { position: relative; display: inline-block; padding-bottom: 9px; white-space: nowrap; font-size: 26px; line-height: 1.35; }
        #phBar { position: absolute; bottom: 0; height: 6px; border-radius: 3px; background: var(--accent); display: none; }
        #currentText { color: #94a3b8; font-weight: 500; }
        #countdown { font-family: 'Monaco', monospace; font-size: 1.8rem; color: var(--accent); font-weight: 700; line-height: 1.2; }
        .cbar { display: none; height: 8px; background: #262626; border-radius: 4px; margin-top: 6px; overflow: hidden; }
        #barFill { height: 100%; width: 0; margin-left: auto; background: var(--accent); border-radius: 4px; }
        body.no-bar #phBar, body.no-bar .cbar { display: none !important; }
        body.hide-time #countdown { display: none; }

        .status-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; background: #111; border-radius: 8px; padding: 6px 15px; border: 1px solid #222; }
        .progress-container { flex-grow: 1; display: flex; align-items: center; gap: 8px; background: #1a1a1a; padding: 4px 10px; border-radius: 20px; border: 1px solid #222; }
        .progress-bar { height: 12px; background: #333; border-radius: 6px; flex-grow: 1; position: relative; overflow: hidden; }
        #progressFill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

        .timer-meta { display: flex; align-items: center; gap: 5px; }
        #progressPercent { background: var(--yellow); color: #000; font-size: 0.8rem; font-family: 'Monaco', monospace; font-weight: 700; padding: 2px 8px; border-radius: 10px; min-width: 40px; text-align: center; }
        #spentTime { background: var(--green); color: #000; font-size: 0.8rem; font-family: 'Monaco', monospace; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
        #totalSessionTime { background: #333; color: #aaa; font-size: 0.75rem; font-family: 'Monaco', monospace; padding: 2px 8px; border-radius: 10px; border: 1px solid #444; }

        .led-slot { position: absolute; top: 8px; right: 14px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; cursor: help; z-index: 5; }
        .status-led { width: 10px; height: 10px; border-radius: 50%; background: #222; border: 1px solid #333; box-sizing: border-box; transition: 0.3s; }
        .led-active { background: var(--accent); box-shadow: 0 0 12px var(--accent); }
        .led-ping { background: var(--red) !important; box-shadow: 0 0 15px var(--red) !important; }
        .led-buffer { background: var(--yellow) !important; box-shadow: 0 0 12px var(--yellow) !important; }
        .led-speaking { animation: pulse-glow 1s infinite; }
        .led-legend { display: none; position: absolute; top: 20px; right: -6px; width: min(380px, 86vw); padding-top: 8px; text-align: left; cursor: default; z-index: 400; }
        .led-slot:hover .led-legend, .led-slot.pin .led-legend { display: block; }
        .lg-card { position: relative; background: #0c0c0c; border: 1px solid #2a2a2a; border-radius: 10px; padding: 14px 16px 10px; box-shadow: 0 12px 40px rgba(0,0,0,0.8); }
        .lg-dot { width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; display: block; }
        .d-off { background: #222; border: 1px solid #444; }
        .d-ready { background: var(--accent); box-shadow: 0 0 12px var(--accent); }
        .d-speak { background: var(--accent); box-shadow: 0 0 0 4px rgba(59,130,246,0.35), 0 0 12px var(--accent); }
        .d-buf { background: var(--yellow); box-shadow: 0 0 12px var(--yellow); }
        .d-ping { background: var(--red); box-shadow: 0 0 12px var(--red); }
        @keyframes pulse-glow { 0% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0.4; transform: scale(0.9); } }

        .btns { display: flex; gap: 8px; position: relative; }
        button { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-size: 0.8rem; text-transform: uppercase; }
        .btn-go { background: var(--accent); color: white; }
        .btn-stop { background: #333; color: #888; }

        .icon-btn { flex: 0 0 38px; padding: 0; display: flex; align-items: center; justify-content: center; background: #1a1a1a; color: #9ca3af; border: 1px solid #2a2a2a; }
        .icon-btn:hover, .icon-btn.on { color: var(--accent); border-color: var(--accent); }
        #trashBtn:hover { color: var(--red); border-color: var(--red); }
        svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

        .pop { display: none; position: absolute; top: calc(100% + 6px); right: 0; z-index: 300; background: #0c0c0c; border: 1px solid #2a2a2a; border-radius: 10px; padding: 10px; box-shadow: 0 12px 40px rgba(0,0,0,0.8); max-height: 75vh; overflow-y: auto; box-sizing: border-box; }
        .pop.open { display: block; }
        .sec { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8a8a; }
        .kgrid { display: grid; grid-template-columns: 50px repeat(3, minmax(0, 1fr)); gap: 6px 10px; align-items: center; }
        .kgrp { font-size: 0.7rem; font-weight: 700; color: var(--accent); }
        #newsPop { width: min(760px, 96vw); }
        .pop-row { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; }
        .pop-sec { font-size: 0.6rem; color: #666; text-transform: uppercase; font-weight: 700; margin: 4px 0 6px; letter-spacing: 0.05em; }


        .krow { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.72rem; color: #aaa; }
        .key { flex: 0 0 auto; min-width: 46px; padding: 4px 6px; background: #1a1a1a; color: var(--yellow); border: 1px solid #333; border-radius: 6px; font-family: 'Monaco', monospace; font-size: 0.72rem; text-transform: none; font-weight: 700; }
        .key.cap { border-color: var(--accent); color: var(--accent); animation: pulse-glow 1s infinite; }
        .key.bad { border-color: var(--red); color: var(--red); }
        .mini { flex: 0 0 auto; padding: 4px 8px; background: #1a1a1a; color: #888; border: 1px solid #2a2a2a; display: flex; align-items: center; }
        .mini:hover { color: var(--accent); border-color: var(--accent); }

        .pop-ta { width: 100%; background: var(--card); border: 1px solid #333; border-radius: 8px; color: #ddd; padding: 8px; font-size: 0.8rem; outline: none; resize: vertical; box-sizing: border-box; font-family: inherit; }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .chip { flex: 0 0 auto; padding: 5px 10px; background: #151515; color: #888; border: 1px solid #2a2a2a; font-size: 0.65rem; }
        .chip.on { color: var(--accent); border-color: var(--accent); background: rgba(59,130,246,0.12); }
        .nmsg { padding: 14px; color: #777; font-size: 0.78rem; text-align: center; }
        #newsText { height: 280px; }
        #newsCount, #newsAt, #pubStamp { font-family: 'Monaco', monospace; font-size: 0.7rem; color: #aaa; background: #333; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
        #pubStamp { background: rgba(251,191,36,0.15); color: var(--yellow); }
        .sep { width: 1px; background: #2a2a2a; margin: 0 4px; align-self: stretch; }
        .chip.bul.on { color: var(--yellow); border-color: var(--yellow); background: rgba(251,191,36,0.12); }

        .rx { font-family: 'Monaco', monospace; font-weight: 800; font-size: 0.9rem; letter-spacing: -1px; }
        #rulesPop { width: min(560px, 94vw); }
        .rrow { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
        .rtog { flex: 0 0 26px; height: 26px; padding: 0; border-radius: 13px; background: #1a1a1a; border: 1px solid #333; display: flex; align-items: center; justify-content: center; }
        .rtog::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #555; }
        .rtog.on { background: rgba(59,130,246,0.25); border-color: var(--accent); }
        .rtog.on::after { background: var(--accent); }
        .rrow input { flex: 1; min-width: 0; background: var(--card); border: 1px solid #333; border-radius: 6px; color: #ddd; padding: 6px 8px; font-family: 'Monaco', monospace; font-size: 0.72rem; outline: none; box-sizing: border-box; }
        .rrow input:focus { border-color: var(--accent); }
        .rrow input.bad { border-color: var(--red); color: var(--red); }
        .rrow.off input { opacity: 0.4; }
        .analysis-dock { flex-grow: 1; overflow-y: auto; padding: 15px; background: #050505; scroll-behavior: smooth; }
        .analysis-table { width: 100%; max-width: 900px; margin: 0 auto; border-collapse: collapse; }
        .analysis-table tr { cursor: pointer; transition: background 0.2s; }
        .analysis-table td { padding: 12px; border-bottom: 1px solid #111; vertical-align: middle; }

        .phrase-cell { color: var(--green); font-size: 1.1rem; line-height: 1.5; }
        body.hide-list .analysis-dock { visibility: hidden; }
        .time-cell { color: var(--yellow); text-align: right; font-family: monospace; width: 95px; font-size: 0.95rem; }
        .active-row { background: rgba(59, 130, 246, 0.25) !important; border-left: 5px solid var(--accent); }
        /* ---- PHONE: applied on touch screens (pointer: coarse) ---- */
        .paste-btn, .nav, .pop-head { display: none; }
        #trashBtn { position: relative; overflow: hidden; }
        #trashBtn.undo { color: var(--yellow); border-color: var(--yellow); background: rgba(251,191,36,0.12); }
        #trashBtn.undo::after { content: ''; position: absolute; left: 0; bottom: 0; height: 4px; background: var(--yellow); animation: undo-run 5s linear forwards; }
        @keyframes undo-run { from { width: 100%; } to { width: 0; } }

        body.phone { height: 100vh; height: 100dvh; touch-action: manipulation; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
        body.phone .analysis-dock { display: none; }
        body.phone .header-controls { flex: 1; min-height: 0; padding: 8px; border-bottom: 0; z-index: auto; }
        body.phone .wrapper { max-width: none; height: 100%; margin: 0; display: grid; gap: 8px; }
        body.phone .status-row, body.phone .btns { display: contents; }
        body.phone .progress-container { grid-area: prog; min-width: 0; padding: 4px 12px; border-radius: 24px; gap: 8px; }
        body.phone #textInput { grid-area: txt; height: auto; min-height: 0; font-size: 0.95rem; font-family: 'Monaco', monospace; }
        body.phone .controls { grid-area: ctl; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
        body.phone .controls .card { height: auto !important; flex: 1; min-height: 0; justify-content: center; gap: 4px; }
        body.phone select { margin-top: 0; font-size: 0.9rem; height: 36px; }
        body.phone input[type=range]::-webkit-slider-thumb { width: 44px; height: 28px; margin-top: -11px; }
        body.phone input[type=range] { margin: 10px 0 2px; }
        body.phone .hud-static { font-size: 1.5rem; margin-top: 0; }
        body.phone .cbar { align-self: stretch; margin-top: 0; }
        body.phone #phrase { order: 1; } body.phone .cbar { order: 2; } body.phone #countdown { order: 3; }
        body.phone .display-box { grid-area: disp; margin: 0; padding: 8px 12px; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        body.phone #phrase { align-self: stretch; }
        body.phone #countdown { font-size: 2.2rem; }
        body.phone .btns > button { font-size: 0.9rem; min-width: 0; }
        body.phone #startBtn, body.phone #pauseBtn { grid-area: go; }
        body.phone #stopBtn { grid-area: stop; }
        body.phone #gearBtn { grid-area: gear; }
        body.phone #pasteBtn { grid-area: paste; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(59,130,246,0.14); color: var(--accent); border: 1px solid var(--accent); }
        body.phone #newsBtn { grid-area: news; }
        body.phone #rulesBtn { grid-area: rules; }
        body.phone #trashBtn { grid-area: trash; }
        body.phone svg.ic { width: 22px; height: 22px; }

        body.phone:not(.live) #pauseBtn, body.phone.live #startBtn { display: none; }
        body.phone:not(.live) .display-box, body.phone:not(.live) .nav { display: none; }
        body.phone.live .nav { display: flex; }
        body.phone.live #textInput, body.phone.live .controls, body.phone.live #pasteBtn, body.phone.live #newsBtn, body.phone.live #rulesBtn, body.phone.live #trashBtn { display: none; }

        /* ---- phone menus: small sheets / cards, News full screen ---- */
        @keyframes syncpulse { from { opacity: 0.25; } to { opacity: 1; } }
        body.phone #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.66); z-index: 450; }
        body.phone.pop-open #backdrop { display: block; }
        body.phone #gearPop, body.phone #rulesPop, body.phone #newsPop { position: fixed; z-index: 500; width: auto; max-height: none !important; box-sizing: border-box; }
        body.phone #newsPop { top: 8px; left: 8px; right: 8px; bottom: 8px; }
        body.phone .rrow { display: grid; grid-template-columns: 52px minmax(0, 1fr) 44px; gap: 8px; align-items: center; background: #121212; border: 1px solid #262626; border-radius: 10px; padding: 10px; margin-bottom: 12px; }
        body.phone .rtog { width: 52px; height: 30px; flex: none; border-radius: 15px; padding: 0 3px; justify-content: flex-start; grid-column: 1; grid-row: 1; }
        body.phone .rtog::after { width: 22px; height: 22px; }
        body.phone .rtog.on { justify-content: flex-end; }
        body.phone .rrow input { height: 44px; font-size: 0.85rem; }
        body.phone .rfind { grid-column: 2; grid-row: 1; }
        body.phone .rrep { grid-column: 2; grid-row: 2; }
        body.phone .rdel { grid-column: 3; grid-row: 1; width: 44px; height: 44px; justify-content: center; font-size: 1.3rem; padding: 0; }
        body.phone .rule-add { display: none; }
        body.phone .rules-head { display: flex; align-items: center; gap: 8px; }
        body.phone .rt { flex: 1; font-size: 1.3rem; color: #e5e5e5; }
        body.phone .addp { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; height: 48px; padding: 0 14px; background: rgba(59,130,246,0.14); color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; font-size: 0.75rem; }
        body.phone .pop-head { display: flex; justify-content: flex-end; position: sticky; top: 0; z-index: 2; background: #0c0c0c; padding-bottom: 8px; }
        body.phone #newsPop .pop-head { display: contents; }
        body.phone #copyText { display: flex; align-items: center; justify-content: center; grid-area: txt; justify-self: end; align-self: start; margin: 8px; width: 44px; height: 44px; padding: 0; z-index: 2; background: #0c0c0c; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; }
        body.phone.live #copyText { display: none; }
        body.phone #textInput { padding-right: 64px; }
        /* News: full screen, grid */
        body.phone #newsPop.open { display: grid; overflow: hidden; padding: 12px; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px 8px; }
        body.phone #newsPop .pop-row, body.phone #newsPop #verRow { display: contents; }
        body.phone #newsPop #newsMsg { grid-column: 1 / -1; align-self: start; z-index: 1; }
        body.phone #newsPop #newsText { grid-column: 1 / -1; height: auto; min-height: 0; font-size: 0.85rem; line-height: 1.5; resize: none; }
        body.phone #newsPop #pubStamp:empty, body.phone #newsPop #newsAt:empty { display: none; }
        body.phone #newsPop .chips { margin: 0 !important; gap: 8px; }
        body.phone #newsPop .chip { font-size: 0.7rem; }
        body.phone #newsPop .chip.bul { order: -2; }
        body.phone #newsPop .sep { order: -1; }
        body.phone #newsPop #newsRetry { width: 44px; height: 44px; justify-self: end; padding: 0; justify-content: center; }
        body.phone #newsPop #newsRetry svg { width: 22px !important; height: 22px !important; }
        body.phone #newsPop #newsCopy { width: auto !important; flex: none !important; padding: 0; display: flex; align-items: center; justify-content: center; }
        @media (orientation: portrait) {
            body.phone #gearPop, body.phone #rulesPop { left: 8px; right: 8px; bottom: 8px; top: auto; border-radius: 16px; padding: 22px 12px 12px; overflow-y: auto; max-height: calc(100dvh - 16px) !important; box-shadow: 0 -8px 40px rgba(0,0,0,0.6); }
            body.phone #gearPop::before, body.phone #rulesPop::before { content: ''; position: absolute; top: 8px; left: 50%; margin-left: -18px; width: 36px; height: 4px; border-radius: 2px; background: #444; }
            body.phone .rarrow { display: none; }
            body.phone #newsPop.open { grid-template-rows: 28px minmax(0, 1fr) auto 44px 56px; }
            body.phone #newsPop #pubStamp { grid-column: 1 / span 5; grid-row: 1; justify-self: start; align-self: center; }
            body.phone #newsPop #newsCount { grid-column: 6 / span 4; grid-row: 1; justify-self: end; align-self: center; }
            body.phone #newsPop #newsAt { grid-column: 10 / span 3; grid-row: 1; justify-self: end; align-self: center; }
            body.phone #newsPop #newsText, body.phone #newsPop #newsMsg { grid-row: 2; }
            body.phone #newsPop #newsChips { grid-column: 1 / -1; grid-row: 3; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
            body.phone #newsPop .chip { height: 44px; padding: 0 4px; grid-column: span 2; }
            body.phone #newsPop .chip.bul { grid-column: span 3; height: 48px; }
            body.phone #newsPop .sep { display: none; }
            body.phone #newsPop #verChips { grid-column: 1 / span 10; grid-row: 4; display: flex; }
            body.phone #newsPop #verChips .chip { grid-column: auto; padding: 0 16px; }
            body.phone #newsPop #newsRetry { grid-column: 11 / span 2; grid-row: 4; }
            body.phone #newsPop .pop-close { grid-column: 1 / span 2; grid-row: 5; width: 56px; height: 56px; justify-self: start; }
            body.phone #newsPop #newsCopy { grid-column: 3 / -1; grid-row: 5; height: 56px !important; background: var(--accent); color: #fff; border: 0; border-radius: 10px; }
            body.phone #newsPop #newsCopy svg { width: 26px; height: 26px; }
        }
        @media (orientation: landscape) {
            body.phone #gearPop, body.phone #rulesPop { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(640px, calc(100vw - 16px)); max-height: calc(100dvh - 16px) !important; overflow-y: auto; border-radius: 14px; padding: 12px; }
            body.phone #rulesPop { width: min(720px, calc(100vw - 16px)); }
            body.phone .rrow { display: flex; padding: 8px 10px; margin-bottom: 8px; }
            body.phone .rfind { flex: 1.3; }
            body.phone .rrep { flex: 1; }
            body.phone .rarrow { display: block; flex: 0 0 22px; text-align: center; color: #777; }
            body.phone #newsPop.open { grid-template-rows: 44px 40px minmax(0, 1fr); gap: 8px; }
            body.phone #newsPop #newsChips { grid-column: 1 / span 11; grid-row: 1; display: flex; flex-wrap: nowrap; }
            body.phone #newsPop .chip { height: 44px; padding: 0 10px; font-size: 0.68rem; }
            body.phone #newsPop .sep { display: block; margin: 6px 2px; }
            body.phone #newsPop .pop-close { grid-column: 12; grid-row: 1; width: 44px; height: 44px; justify-self: end; }
            body.phone #newsPop #verChips { grid-column: 1 / span 3; grid-row: 2; display: flex; }
            body.phone #newsPop #verChips .chip { height: 40px; }
            body.phone #newsPop #pubStamp { grid-column: 4 / span 3; grid-row: 2; justify-self: start; align-self: center; }
            body.phone #newsPop #newsCount { grid-column: 8 / span 2; grid-row: 2; justify-self: end; align-self: center; }
            body.phone #newsPop #newsAt { grid-column: 10 / span 2; grid-row: 2; justify-self: end; align-self: center; }
            body.phone #newsPop #newsRetry { grid-column: 12; grid-row: 2; height: 40px; }
            body.phone #newsPop #newsText, body.phone #newsPop #newsMsg { grid-row: 3; }
            body.phone #newsPop #newsText { padding-right: 64px; }

                        <div class="sec">Keys</div>

                <div class="pop-head rules-head"><span class="rx rt">.*</span><button class="addp" id="ruleAddP" aria-label="Add rule"><svg class="ic"><use href="#i-plus"/></svg>Add</button><button class="pop-close" aria-label="Close">&times;</button></div>

                    <button class="mini" id="newsRetry" title="Reload"><svg class="ic" style="width:14px;height:14px"><use href="#i-reset"/></svg><i class="sdot"></i></button>
                    <button class="icon-btn" id="newsCopy" style="flex:0 0 44px;height:36px;" title="Copy all"><svg class="ic"><use href="#i-copy"/></svg></button>
                </div>
                <div class="pop-row nrow2">
                    <div class="chips" id="bulChips"></div>
                    <div id="verRow" style="display:none;"><div class="chips" id="verChips" style="margin:0;"></div></div>
                </div>
                <div class="ntext">
                    <div class="nmsg" id="newsMsg" style="display:none;"></div>
                    <textarea class="pop-ta" id="newsText"></textarea>
                </div>
                <div class="pop-row nfoot">
                    <span id="pubStamp"></span>

</div>
<div class="analysis-dock" id="dock"><table class="analysis-table"><tbody id="analysisBody"></tbody></table></div>

<div id="backdrop"></div>
<script>
    const $ = id => document.getElementById(id);
    const synth = window.speechSynthesis;
    const DEFAULT_REPO = 'vikrant123pundir/air-news';
    const isPhone = matchMedia('(pointer: coarse)').matches;      // touch screen: phone layout
    if (isPhone) document.body.classList.add('phone');
    let chunks = [], newsStarts = [], currentIdx = 0, advanceTimer, watchdogTimer;
    let isPaused = false, active = false, speakToken = 0;
    let audioCtx, oscillator, gainNode;

    // --- STORAGE (new keys are JSON; lpd_wpm / lpd_awl / lpd_voice stay plain strings) ---
    const store = {
        get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
        set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    };
    const esc = s => s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

    // --- AUTOMATED AUDIO ENGINE MANAGEMENT ---
    function initAudioEngine() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            // 10 Hz is sub-audible, but effectively keeps the audio driver awake
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(10, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime); // Start muted
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function setEngineState(isActive) {
        initAudioEngine();
        if (gainNode && audioCtx) gainNode.gain.setTargetAtTime(isActive ? 0.01 : 0, audioCtx.currentTime, 0.015);
        const label = $('voiceEngineLabel');
        if (isActive) { label.classList.add('label-bg-on'); setLED('active'); }
        else label.classList.remove('label-bg-on');
    }

    // --- HUD ---
    function formatAWL(val) {
        const stepStr = $('awlInput').getAttribute('step') || "1";
        const decimals = stepStr.includes('.') ? stepStr.split('.')[1].length : 0;
        return parseFloat(val).toFixed(decimals);
    }

    const savedWPM = localStorage.getItem('lpd_wpm');
    if (savedWPM) $('wpmInput').value = savedWPM;
    $('wpmHUD').textContent = $('wpmInput').value;
    const savedAWL = localStorage.getItem('lpd_awl');
    if (savedAWL) $('awlInput').value = savedAWL;
    $('awlHUD').textContent = formatAWL($('awlInput').value);

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60), secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function setLED(state) {
        const led = $('statusLed');
        led.classList.remove('led-active', 'led-speaking', 'led-ping', 'led-buffer');
        if (state === 'active') led.classList.add('led-active');
        if (state === 'speaking') led.classList.add('led-active', 'led-speaking');
        if (state === 'ping') led.classList.add('led-ping');
        if (state === 'buffering') led.classList.add('led-buffer');
    }                                                           // 'off' = no class = dark

    // --- THE PHRASE, AND THE BAR UNDER IT ---
    const ph = { mode: 'none', total: 0 };  // mode: none | inline (bar under the letters) | plain (full-width bar)
    let phText = 'READY', phBar = false, lastF = 1, rafId = 0, bufTimer = 0;
    const barColor = f => opts.barColor === 'blue' ? 'var(--accent)' : opts.barColor === 'grey' ? 'var(--grey)' : f <= 0.25 ? 'var(--red)' : f <= 0.5 ? 'var(--yellow)' : 'var(--accent)';
    function hideBars() { $('phBar').style.display = 'none'; $('cbar').style.display = 'none'; $('countdown').style.color = ''; }

    // Show the phrase. With a bar: fit it on one line (or wrap it), then the bar runs at an even speed across its width.
    function showPhrase(text, withBar) {
        phText = text; phBar = withBar;
        const t = $('currentText'), wrap = $('phWrap'), box = $('phrase');
        t.textContent = text;
        wrap.style.fontSize = ''; wrap.style.whiteSpace = 'nowrap'; wrap.style.maxWidth = '';
        ph.mode = 'none'; hideBars();
        if (!withBar) return;
        const avail = box.clientWidth - 68;
        let fs = isPhone ? 28 : 26; wrap.style.fontSize = fs + 'px';
        while (wrap.offsetWidth > avail && fs > 15) { fs--; wrap.style.fontSize = fs + 'px'; }
        if (wrap.offsetWidth > avail) {                         // still too long: wrap it and use the plain bar
            wrap.style.whiteSpace = 'normal'; wrap.style.maxWidth = '100%'; wrap.style.fontSize = (isPhone ? 24 : 22) + 'px'; ph.mode = 'plain'; return;
        }
        ph.total = wrap.getBoundingClientRect().width; ph.mode = 'inline';
    }

    // f = fraction of time left. The bar's right end stays put; its left end walks right.
    function setBar(f) {
        f = Math.max(0, Math.min(1, f)); lastF = f;
        const col = barColor(f);
        $('countdown').style.color = col;
        const pb = $('phBar'), cb = $('cbar');
        if (ph.mode === 'inline') {
            cb.style.display = 'none';
            if (f <= 0) { pb.style.display = 'none'; return; }
            const x = (1 - f) * ph.total;
            pb.style.display = 'block'; pb.style.left = x + 'px'; pb.style.width = Math.max(0, ph.total - x) + 'px'; pb.style.background = col;
        } else if (ph.mode === 'plain') {
            pb.style.display = 'none'; cb.style.display = 'block';
            const fill = $('barFill'); fill.style.width = (f * 100) + '%'; fill.style.background = col;
        }
    }
    function refreshBar() { if (ph.mode !== 'none' && phBar) { const f = lastF; showPhrase(phText, true); setBar(f); } }
    window.addEventListener('resize', refreshBar);

    // --- VOICES ---
    function initVoices() {
        const select = $('voiceSelect');
        const voices = synth.getVoices();
        if (voices.length === 0) return;
        select.innerHTML = '';
        const savedVoice = localStorage.getItem('lpd_voice');
        let selectedIndex = 0, stefanIndex = -1, googleUKIndex = -1;
        const englishVoices = voices.filter(v => /^en/i.test(v.lang));
        englishVoices.forEach((v, i) => {
            const opt = document.createElement('option');
            opt.value = v.name;
            opt.textContent = v.name.replace("Microsoft ", "");
            select.appendChild(opt);
            if (savedVoice && v.name === savedVoice) selectedIndex = i;
            if (v.name.includes("Stefan") && v.name.toLowerCase().includes("online")) stefanIndex = i;
            if (v.name === "Google UK English Male") googleUKIndex = i;
        });
        if (!savedVoice || !englishVoices.find(v => v.name === savedVoice)) {
            if (stefanIndex !== -1) selectedIndex = stefanIndex;
            else if (googleUKIndex !== -1) selectedIndex = googleUKIndex;
        }
        if (select.options.length > 0) {
            select.selectedIndex = selectedIndex;
            localStorage.setItem('lpd_voice', englishVoices[selectedIndex].name);
        }
    }
    synth.onvoiceschanged = initVoices;
    initVoices();
    $('voiceSelect').onchange = (e) => { localStorage.setItem('lpd_voice', e.target.value); e.target.blur(); };

    // --- SLIDERS ---
    $('wpmInput').oninput = (e) => { $('wpmHUD').textContent = e.target.value; localStorage.setItem('lpd_wpm', e.target.value); };
    $('wpmInput').onchange = (e) => { updateUI(); e.target.blur(); };
    $('awlInput').oninput = (e) => { $('awlHUD').textContent = formatAWL(e.target.value); localStorage.setItem('lpd_awl', e.target.value); };
    $('awlInput').onchange = (e) => { updateUI(); e.target.blur(); };

    function calculateWait(text) {
        const wpm = parseInt($('wpmInput').value);
        const awl = parseFloat($('awlInput').value);
        return (((text.replace(/[^a-zA-Z0-9]/g, '').length / awl) / wpm) * 60);
    }

    // --- PHRASES: one phrase per line ---
    // phrases = non-empty lines after the rules; a blank line between two phrases starts the next news item
    function buildChunks() {
        chunks = []; newsStarts = []; let gap = false;
        applyRules($('textInput').value).split(/\r?\n/).forEach(l => {
            const t = l.replace(/\s+/g, ' ').trim();
            if (!t) { if (chunks.length) gap = true; return; }
            if (!chunks.length || gap) newsStarts.push(chunks.length);
            gap = false; chunks.push({ text: t });
        });
        document.body.classList.toggle('has-news', newsStarts.length > 1);
    }
    function initialProcess() { buildChunks(); }
    const newsOf = i => { let k = 0; newsStarts.forEach((st, n) => { if (st <= i) k = n; }); return k; };

    function persist() { store.set('lpd_text', $('textInput').value); }
    const updateUI = () => { renderAnalysis(); updateStats(); persist(); };

    function renderAnalysis() {
        $('analysisBody').innerHTML = chunks.map((c, i) => `<tr id="row-${i}" onclick="jumpTo(${i})"><td class="phrase-cell">${esc(c.text)}</td><td class="time-cell">${calculateWait(c.text).toFixed(2)}s</td></tr>`).join('');
        if (active) { const r = $(`row-${currentIdx}`); if (r) r.classList.add('active-row'); }
    }

    function updateStats() {
        const percent = chunks.length > 0 ? Math.round((currentIdx / chunks.length) * 100) : 0;
        $('progressFill').style.width = percent + '%';
        $('progressPercent').textContent = percent + '%';
        let total = 0, spent = 0;
        chunks.forEach((c, i) => { const t = calculateWait(c.text); total += t; if (i < currentIdx) spent += t; });
        if (newsStarts.length > 1) $('newsChipTxt').textContent = (newsOf(Math.min(currentIdx, chunks.length - 1)) + 1) + '/' + newsStarts.length;
        $('totalSessionTime').textContent = formatTime(total);
        $('spentTime').textContent = formatTime(spent);
    }


    // --- PLAYBACK ---
    const syncLive = () => document.body.classList.toggle('live', active);
    let wakeLock = null;
    async function keepAwake(on) {                          // phone: keep the screen on during a session (needs https)
        if (!isPhone) return;
        try {
            if (on) { if (!wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }
            else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
        } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && active) keepAwake(true); });
    function clearTimers() { cancelAnimationFrame(rafId); clearTimeout(advanceTimer); clearTimeout(watchdogTimer); clearTimeout(bufTimer); }
    function hardReset() { synth.cancel(); clearTimers(); speakToken++; }

    function speak() {
        if (currentIdx >= chunks.length) { finish(); return; }
        if (isPaused) return;

        updateStats();
        const c = chunks[currentIdx];
        document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
        const row = $(`row-${currentIdx}`);
        if (row) { row.classList.add('active-row'); row.scrollIntoView({ behavior: 'smooth', block: 'center' }); }

        const token = ++speakToken;
        let started = false;
        const u = new SpeechSynthesisUtterance(c.text);
        u.voice = synth.getVoices().find(v => v.name === $('voiceSelect').value) || synth.getVoices()[0];
        u.rate = 0.95;
        showPhrase(c.text, true);
        $('countdown').textContent = calculateWait(c.text).toFixed(2) + "s";
        setBar(1);
        clearTimeout(bufTimer);                                 // amber only if the voice is slow to start
        bufTimer = setTimeout(() => { if (!started && token === speakToken && !isPaused) setLED('buffering'); }, Math.max(0, opts.bufMs || 0));

        // Watchdog: if speech never starts, re-ping the engine
        clearTimeout(watchdogTimer);
        watchdogTimer = setTimeout(() => {
            if (!started && token === speakToken && !isPaused) {
                setLED('ping');
                synth.cancel();
                setTimeout(() => { if (!isPaused && token === speakToken) speak(); }, 300);
            }
        }, 2000);

        u.onstart = () => {
            if (token !== speakToken) return;
            started = true;
            clearTimeout(watchdogTimer); clearTimeout(bufTimer);
            setLED('speaking');
            startTimer(calculateWait(c.text) * 1000);
        };
        u.onend = () => { if (token === speakToken && !isPaused) setLED('active'); };
        synth.speak(u);
    }

    // Timer is clock-based: the end time is fixed once, so late ticks cannot stretch a phrase.
    function startTimer(ms) {
        cancelAnimationFrame(rafId); clearTimeout(advanceTimer);
        const endAt = performance.now() + ms;
        const frame = () => {
            const rem = Math.max(0, endAt - performance.now());
            $('countdown').textContent = (rem / 1000).toFixed(2) + "s";
            setBar(ms > 0 ? rem / ms : 0);
            if (rem > 0) rafId = requestAnimationFrame(frame);
        };
        frame();
        advanceTimer = setTimeout(() => {
            cancelAnimationFrame(rafId);
            $('countdown').textContent = "0.00s";
            setBar(0);
            currentIdx++;
            speak();
        }, ms);
    }

    function finish() {
        clearTimers(); active = false; syncLive(); keepAwake(false); document.body.classList.remove('paused');
        setEngineState(false);
        showPhrase('FINISHED', false);
        $('countdown').textContent = "0.00s";
        $('pauseBtn').disabled = true;
        setLED('off');
        updateStats();
    }

    function beginPlay() {
        isPaused = false; active = true; syncLive(); keepAwake(true); document.body.classList.remove('paused');
        $('pauseBtn').disabled = false;
        $('pauseBtn').textContent = "Pause";
        setEngineState(true);
        speak();
    }

    window.jumpTo = (idx) => {
        if (idx < 0 || idx >= chunks.length) return;
        hardReset(); currentIdx = idx; beginPlay();
    };

    function startSession() {
        if (!chunks.length) return;
        hardReset(); currentIdx = 0; beginPlay();
    }

    function stopSession() {
        hardReset(); active = false; isPaused = false; currentIdx = 0; syncLive(); keepAwake(false); document.body.classList.remove('paused');
        showPhrase('READY', false);
        $('countdown').textContent = "0.00s";
        $('pauseBtn').textContent = "Pause";
        $('pauseBtn').disabled = true;
        updateStats();
        document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
        setLED('off');
        $('dock').scrollTo({ top: 0 });
        setEngineState(false);
    }

    function togglePause() {
        if (!active) return;
        if (!isPaused) {
            isPaused = true; hardReset(); document.body.classList.add('paused');
            $('pauseBtn').textContent = "Resume";
            const c = chunks[currentIdx];
            if (c) $('countdown').textContent = calculateWait(c.text).toFixed(2) + "s";
            setBar(1);
            setLED('active');
            setEngineState(false);
        } else {
            isPaused = false; document.body.classList.remove('paused');
            $('pauseBtn').textContent = "Pause";
            setEngineState(true);
            speak();
        }
    }

    $('startBtn').onclick = (e) => { startSession(); e.currentTarget.blur(); };
    $('stopBtn').onclick = (e) => { stopSession(); e.currentTarget.blur(); };
    $('pauseBtn').onclick = (e) => { togglePause(); e.currentTarget.blur(); };

    $('textInput').oninput = () => { initialProcess(); updateUI(); };

    // --- TRASH + UNDO ---
    function trashAll() {
        const text = $('textInput').value;
        if (!text) return;                              // never overwrite the backup with nothing
        store.set('lpd_trash', { text });
        stopSession();
        $('textInput').value = '';
        chunks = []; newsStarts = []; document.body.classList.remove('has-news');
        updateUI();
    }
    function restoreTrash() {
        const t = store.get('lpd_trash', null);
        if (!t) return false;
        $('textInput').value = t.text || '';
        localStorage.removeItem('lpd_trash');
        initialProcess(); updateUI();
        return true;
    }
    let undoTimer = 0;
    function endUndo() { clearTimeout(undoTimer); const b = $('trashBtn'); b.classList.remove('undo'); b.querySelector('use').setAttribute('href', '#i-trash'); }
    $('trashBtn').onclick = (e) => {                            // phone: after clearing, the button becomes Undo for 5 s
        const b = e.currentTarget;
        if (b.classList.contains('undo')) { restoreTrash(); endUndo(); b.blur(); return; }
        const had = !!$('textInput').value;
        trashAll();
        if (isPhone && had) { b.classList.add('undo'); b.querySelector('use').setAttribute('href', '#i-undo'); clearTimeout(undoTimer); undoTimer = setTimeout(endUndo, 5000); }
        b.blur();
    };
    $('pasteBtn').onclick = async (e) => {
        const lbl = $('pasteLbl'); e.currentTarget.blur();
        try {
            const t = await navigator.clipboard.readText();
            if (!t.trim()) lbl.textContent = 'Clipboard empty';
            else { $('textInput').value = t; initialProcess(); updateUI(); lbl.textContent = 'Pasted'; }
        } catch (err) { lbl.textContent = 'Not allowed here'; }
        setTimeout(() => { lbl.textContent = 'Paste'; }, 1500);
    };
    $('prevBtn').onclick = () => runAction('prev');
    $('repBtn').onclick = () => runAction('repeat');
    $('nextBtn').onclick = () => runAction('next');
    $('newsBackBtn').onclick = () => runAction('prevNews');
    $('newsFwdBtn').onclick = () => runAction('nextNews');
    // phone: tap the phrase panel = pause / resume; hold it for one second = stop
    (function () {
        if (!isPhone) return;
        const box = document.querySelector('.display-box'); let t = 0, fired = false, down = false;
        const cancel = () => { clearTimeout(t); box.classList.remove('holding'); down = false; };
        box.addEventListener('pointerdown', () => { if (!active) return; down = true; fired = false; box.classList.add('holding'); t = setTimeout(() => { fired = true; box.classList.remove('holding'); down = false; stopSession(); }, 1000); });
        box.addEventListener('pointerup', () => { if (!down) return; const wasHold = fired; cancel(); if (!wasHold) togglePause(); });

    })();
    document.querySelectorAll('.pop-close').forEach(b => b.onclick = () => closePops());

    // --- KEYBOARD SHORTCUTS (editable) ---
    const DEFAULT_KEYS = { pause: 'Space', stop: 'Escape', prev: 'ArrowLeft', repeat: 'KeyR', next: 'ArrowRight', prevNews: 'ArrowUp', nextNews: 'ArrowDown' };
    const KEY_GROUPS = [['Play', [['pause', 'Play / pause', 2], ['stop', 'Stop', 1]]], ['Move', [['prev', 'Prev', 1], ['repeat', 'Repeat', 1], ['next', 'Next', 1]]], ['News', [['prevNews', 'Prev', 1], ['nextNews', 'Next', 1]]]];
    const savedKeys = store.get('lpd_keys', {});
    let keys = {}; Object.keys(DEFAULT_KEYS).forEach(a => keys[a] = savedKeys[a] || DEFAULT_KEYS[a]);
    let captureAction = null;

    function keyLabel(code) {
        const m = { Space: 'Space', ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', Escape: 'Esc', Enter: 'Enter' };
        if (m[code]) return m[code];
        return code.replace(/^Key|^Digit/, '').replace(/^Numpad/, 'Num ');
    }
    let renderingKeys = false;
    function renderKeys() {
        renderingKeys = true;
        $('keyGrid').innerHTML = KEY_GROUPS.map(([g, items]) => `<div class="kgrp">${g}</div>` + items.map(([a, label, span]) => `<div class="krow" style="grid-column: span ${span}"><span>${label}</span><button class="key" data-a="${a}">${esc(keyLabel(keys[a]))}</button></div>`).join('')).join('');
        renderingKeys = false;
    }
    $('keyGrid').onclick = (e) => {
        const b = e.target.closest('.key'); if (!b) return;
        const a = b.dataset.a;
        captureAction = a;
        renderKeys();
        const nb = document.querySelector(`.key[data-a="${a}"]`);
        nb.classList.add('cap'); nb.textContent = '…'; nb.focus();
    };
    $('keyGrid').addEventListener('focusout', () => { if (captureAction && !renderingKeys) { captureAction = null; renderKeys(); } });
    $('keyReset').onclick = () => { keys = Object.assign({}, DEFAULT_KEYS); store.set('lpd_keys', keys); captureAction = null; renderKeys(); };

    function runAction(a) {
        switch (a) {
            case 'pause': if (active) togglePause(); else startSession(); break;
            case 'repeat': if (active) jumpTo(currentIdx); break;
            case 'prev': if (active) jumpTo(Math.max(0, currentIdx - 1)); break;
            case 'next': if (active && currentIdx < chunks.length - 1) jumpTo(currentIdx + 1); break;
            case 'nextNews': if (active && newsStarts.length > 1) { const k = newsOf(currentIdx); if (k < newsStarts.length - 1) jumpTo(newsStarts[k + 1]); } break;
            case 'prevNews': if (active && newsStarts.length > 1) { const k = newsOf(currentIdx); jumpTo(currentIdx > newsStarts[k] ? newsStarts[k] : newsStarts[Math.max(0, k - 1)]); } break;
            case 'stop': stopSession(); break;
        }
    }

    document.addEventListener('keydown', (e) => {
        if (captureAction) {
            e.preventDefault(); e.stopPropagation();
            if (/^(Shift|Control|Alt|Meta)/.test(e.code)) return;
            const a = captureAction;
            const clash = Object.keys(keys).find(k => k !== a && keys[k] === e.code);
            captureAction = null;
            if (clash) {
                renderKeys();
                const nb = document.querySelector(`.key[data-a="${a}"]`);
                nb.classList.add('bad'); setTimeout(() => nb.classList.remove('bad'), 700);
            } else {
                keys[a] = e.code; store.set('lpd_keys', keys); renderKeys();
            }
            return;
        }
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.code === 'KeyZ') {
            if (!$('textInput').value && restoreTrash()) e.preventDefault();
            return;
        }
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const t = e.target;
        if (t && t.closest && t.closest('.pop')) return;
        if (t && /^(TEXTAREA|SELECT|INPUT)$/.test(t.tagName)) {
            if (e.code === 'Escape') t.blur();           // Esc leaves the text box
            return;
        }
        const act = Object.keys(keys).find(k => keys[k] === e.code);
        if (!act) return;
        e.preventDefault();
        if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
        if (e.repeat) return;
        runAction(act);
    });

    // --- OPTIONS (toggles, colour, amber delay) + PROMPT SYNC ---
    let opts = Object.assign({ hideTime: false, hideList: false, bar: true, prompt: '', promptB: '', repo: '', bufMs: 500, barColor: 'tri' }, store.get('lpd_opts', {}));
    delete opts.hideCur; delete opts.barMode;
    localStorage.removeItem('lpd_psync');
    function applyOpts() {
        document.body.classList.toggle('hide-time', opts.hideTime);
        document.body.classList.toggle('hide-list', opts.hideList);
        document.body.classList.toggle('no-bar', !opts.bar);

        $('togList').classList.toggle('on', opts.hideList);

    $('togList').onclick = (e) => { opts.hideList = !opts.hideList; applyOpts(); e.currentTarget.blur(); };

    function bufStep(dir) { const el = $('bufInput'); if (dir > 0) el.stepUp(); else el.stepDown(); el.dispatchEvent(new Event('input')); }
    $('bufMinus').onclick = (e) => { bufStep(-1); e.currentTarget.blur(); };
    $('bufPlus').onclick = (e) => { bufStep(1); e.currentTarget.blur(); };

    $('bufInput').oninput = (e) => { opts.bufMs = Math.max(0, parseInt(e.target.value) || 0); store.set('lpd_opts', opts); };
    function copyPromptBtn(btnId, get) {

    copyPromptBtn('copyText', () => $('textInput').value);
    $('ruleAddP').onclick = () => $('ruleAdd').click();

    // prompts: read-only from the repo (config/prompt-categories.txt, config/prompt-bulletins.txt); GitHub is the master copy
    const PSYNC = [['prompt', 'prompt-categories.txt'], ['promptB', 'prompt-bulletins.txt']];
    let psyncAt = 0;
    const normP = t => (t || '').replace(/\r\n/g, '\n').replace(/\s+$/, '');
    function repoSlug() { return (opts.repo || DEFAULT_REPO).trim().replace(/^https?:\/\/(www\.)?github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, ''); }
    function configBase() { const b = dataBase(); if (!b) return ''; return b.endsWith('/data/') ? b.slice(0, -5) + 'config/' : b; }
    function psyncDot(state) { const b = $('newsRetry'); b.classList.remove('ok', 'run', 'off'); b.classList.add(state); }
    async function fetchText(url, ms = 15000) {
        const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms);
        try { const r = await fetch(url, { credentials: 'omit', signal: ac.signal, cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.text(); }
        finally { clearTimeout(t); }
    }
    async function syncPrompts(manual) {
        const base = configBase(); if (!base) { psyncDot('off'); return; }
        if (!manual && Date.now() - psyncAt < 60000) return;
        psyncAt = Date.now(); psyncDot('run');
        let got = 0;
        for (const [o, file] of PSYNC) { try { opts[o] = normP(await fetchText(`${base}${file}?t=${Date.now()}`)); got++; } catch (e) { /* keep the copy already on this device */ } }
        if (got) store.set('lpd_opts', opts);

    function closePops() { document.body.classList.remove('pop-open'); document.querySelectorAll('.pop').forEach(p => p.classList.remove('open')); $('gearBtn').classList.remove('on'); $('newsBtn').classList.remove('on'); $('rulesBtn').classList.remove('on'); }
    // the settings panel opens under the buttons and never runs past the window: it scrolls inside itself
    function fitPop() { const p = $('gearPop'); if (!p.classList.contains('open')) return; p.style.maxHeight = Math.max(160, innerHeight - p.getBoundingClientRect().top - 12) + 'px'; }
    window.addEventListener('resize', fitPop);

    document.addEventListener('click', (e) => {

    // --- NEWS: six AIR categories (open feed) + Morning/Evening bulletins (GitHub data folder) ---
    const CATS = [['National', 41706], ['International', 33], ['Regional', 37], ['Sports', 11], ['Business', 39], ['Elections', 388]];
    const BULS = [['Morning', 'morning-news'], ['Evening', 'evening-news']];
    let newsTab = store.get('lpd_newstab', 'cat:41706');
    let bulVer = store.get('lpd_bulver', 0);                 // 0 = latest, 1 = previous
    let newsCache = store.get('lpd_newscache2', {});          // tab -> { day, at, versions:[{text, published}] }
    const istDay = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
    const hhmm = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const wordCount = t => (t.trim() ? t.trim().split(/\s+/).length : 0);

    function htmlToText(html) {
        const doc = new DOMParser().parseFromString(html || '', 'text/html');
        doc.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
        doc.querySelectorAll('p,div,li,h1,h2,h3,h4,h5,h6,tr').forEach(n => n.append('\n'));
        return (doc.body.textContent || '').replace(/\u00a0/g, ' ').split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean).join('\n\n');
    }

    async function copyText(txt) {
        try { await navigator.clipboard.writeText(txt); return true; }
        catch (e) {
            const ta = document.createElement('textarea');
            ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
            ta.remove(); return ok;
        }
    }
    const norm = s => s.replace(/[\u00a0\u200b]/g, ' ').replace(/\s+/g, ' ').trim();
    const isMarker = t => /^[<>\s]+$/.test(t) && t.includes('<') && t.includes('>');          // <><><>
    const STOP = /FOR A LOOK AT TODAY.?S NEWSPAPERS|HEADLINES ONCE AGAIN/i;

    function collectBlocks(root) {
        const out = [];
        const BLOCK = 'p,ol,ul,li,h1,h2,h3,h4,h5,h6,div,table,section,article';
        (function walk(node) {
            node.childNodes.forEach(ch => {
                if (ch.nodeType === 3) { const t = norm(ch.textContent); if (t) out.push({ t }); return; }
                if (ch.nodeType !== 1) return;
                const tag = ch.tagName;
                if (tag === 'OL' || tag === 'UL') {
                    const items = [...ch.querySelectorAll(':scope > li')].map(li => norm(li.textContent)).filter(Boolean);
                    if (items.length) out.push({ list: items });
                    return;
                }
                if (/^(P|H[1-6]|LI|TR)$/.test(tag)) { const t = norm(ch.textContent); if (t) out.push({ t }); return; }
                if (ch.querySelector(BLOCK)) walk(ch);
                else { const t = norm(ch.textContent); if (t) out.push({ t }); }
            });
        })(root);
        return out;
    }

    // Faithful split: the headline list, and the script cut into reading units at every <><><>
    function parseUnits(blocks) {
        const hs = blocks.findIndex(b => b.t && /^THE HEADLINES/i.test(b.t));
        if (hs > 0) blocks = blocks.slice(hs);                                  // a whole page was copied
        const end = blocks.findIndex(b => b.t && STOP.test(b.t));
        if (end >= 0) blocks = blocks.slice(0, end);                            // newspapers review + repeated headlines

        const fm = blocks.findIndex(b => b.t && isMarker(b.t));
        const headlines = [];
        (fm < 0 ? [] : blocks.slice(0, fm)).forEach(b => {
            if (b.list) headlines.push(...b.list);
            else if (!/^THE HEADLINES/i.test(b.t)) headlines.push(b.t.replace(/^\d+[.)]\s*/, ''));
        });

        let units = [], cur = [];
        blocks.slice(fm + 1).forEach(b => {
            if (b.list) return;
            if (isMarker(b.t)) { if (cur.length) units.push(cur); cur = []; }
            else if (fm >= 0 || !/^THE HEADLINES/i.test(b.t)) cur.push(b.t);
        });
        if (cur.length) units.push(cur);
        if (fm < 0) units = blocks.filter(b => b.t).map(b => [b.t]);            // no separators found: one unit per paragraph
        return { headlines, units };
    }

    function htmlToBlocks(html) {
        const doc = new DOMParser().parseFromString(html || '', 'text/html');
        doc.querySelectorAll('script,style,noscript').forEach(n => n.remove());
        doc.querySelectorAll('br').forEach(b => b.replaceWith(' '));
        return collectBlocks(doc.body);
    }
    function bulletinText(blocks) {
        const { headlines, units } = parseUnits(blocks);
        if (!units.length) return '';
        const head = headlines.length ? `HEADLINES (a hint only; there may be more or fewer news than headlines):\n${headlines.map((h, i) => `${i + 1}. ${h}`).join('\n')}\n\n` : '';
        return head + 'SCRIPT:\n' + units.map((u, i) => `[${i + 1}]\n${u.join('\n')}`).join('\n\n');
    }
    const newsText = items => items.map((it, k) => `News ${k + 1}: ${(it.head || '').trim()}\n${it.paras.join('\n')}`).join('\n\n');

    function dataBase() {
        let r = (opts.repo || DEFAULT_REPO).trim();
        if (!r) return '';
        r = r.replace(/^https?:\/\/(www\.)?github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '');
        if (/^https?:\/\//i.test(r)) return r + '/';
        return `https://raw.githubusercontent.com/${r}/main/data/`;
    }

    async function fetchJSON(url, ms = 30000) {
        const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms);
        try {
            const r = await fetch(url, { credentials: 'omit', signal: ac.signal });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return await r.json();
        } finally { clearTimeout(t); }
    }

    // today's stories (IST day), oldest first
    async function fetchCategory(id) {
        const arr = await fetchJSON(`https://newsonair.gov.in/wp-json/wp/v2/posts?categories=${id}&per_page=100&orderby=date&order=asc&after=${istDay()}T00:00:00&_fields=date,title,content`);
        const items = arr.map(p => ({
            head: htmlToText(p.title && p.title.rendered).replace(/\s+/g, ' '),
            paras: htmlToText(p.content && p.content.rendered).split('\n\n').filter(Boolean)
        })).filter(i => i.paras.length);
        return { versions: [{ text: newsText(items) }] };
    }

    async function fetchBulletin(kind) {
        const base = dataBase();
        if (!base) throw new Error('NOREPO');
        const d = await fetchJSON(base + kind + '.json');
        const versions = (d.items || []).slice(0, 2).map(it => ({ published: it.published, text: bulletinText(htmlToBlocks(it.html)) }));
        if (!versions.length) throw new Error('NODATA');
        return { versions };
    }

    function fmtPub(p) {
        const m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)$/.exec(p || ''); if (!m) return p || '';
        const mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+m[2] - 1];
        let h = +m[4]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
        return `${+m[3]} ${mon} · ${h}:${m[5]} ${ap}`;
    }

    function recount() {
        const t = $('newsText').value;
        const n = (t.match(/^(News \d+:|\[\d+\])/gm) || []).length;
        const i = t.indexOf('SCRIPT:\n');
        const body = (i >= 0 ? t.slice(i + 8) : t).replace(/^(News \d+:|\[\d+\])[ \t]*/gm, '');
        $('newsCount').textContent = `${n} · ${wordCount(body)} w`;
    }
    function showMsg(m) { const el = $('newsMsg'); el.textContent = m; el.style.display = m ? '' : 'none'; }
    function errText(e) {
        if (e.message === 'NOREPO') return 'Set the data repo in settings';
        if (e.message === 'NODATA' || /^HTTP 404/.test(e.message)) return newsTab.startsWith('bul:') ? 'No bulletin data yet' : 'Can’t load';
        return e.name === 'AbortError' ? 'Timed out' : 'Can’t load';
    }

    function showEntry() {
        const isBul = newsTab.startsWith('bul:');

        $('newsText').value = v.text;
        showMsg(v.text ? '' : 'No stories yet today');
        recount();
    }

    async function loadTab(force) {
        const key = newsTab, c = newsCache[key];
        if (!force && c && c.day === istDay()) { showEntry(); return; }

        $('verRow').style.display = key.startsWith('bul:') ? '' : 'none';

            entry.day = istDay(); entry.at = hhmm();
            newsCache[key] = entry; store.set('lpd_newscache2', newsCache);
        } catch (e) {
            if (key === newsTab) showMsg(errText(e));
            return;
        }
        if (key === newsTab) showEntry();
    }

    function renderChips() {
        const c = CATS.map(([n, id]) => `<button class="chip${newsTab === 'cat:' + id ? ' on' : ''}" data-t="cat:${id}">${n}</button>`).join('');
        const b = BULS.map(([n, k]) => `<button class="chip bul${newsTab === 'bul:' + k ? ' on' : ''}" data-t="bul:${k}">${n}</button>`).join('');

    }
    const chipClick = (e) => {

    $('verChips').onclick = (e) => {

    $('newsRetry').onclick = () => { loadTab(true); syncPrompts(true); };

    $('newsCopy').onclick = async () => {
        const body = $('newsText').value;

    // --- FIND & REPLACE RULES (applied to the pasted text before it is cut into phrases) ---
    let rules = store.get('lpd_rules', []);                  // [{ on, find, repl }]
    function compileRule(r) { if (!r.find) return null; try { return new RegExp(r.find, 'gm'); } catch (e) { return false; } }   // null = empty, false = invalid
    function applyRules(raw) {
        let t = raw;
        rules.forEach(r => {
            if (!r.on) return;
            const re = compileRule(r); if (!re) return;
            t = t.replace(re, (r.repl || '').replace(/\\n/g, '\n'));
        });
        return t;
    }
    function renderRules() {
        $('ruleList').innerHTML = rules.map((r, i) => `<div class="rrow${r.on ? '' : ' off'}" data-i="${i}"><button class="rtog${r.on ? ' on' : ''}" title="On / off"></button><input class="rfind${compileRule(r) === false ? ' bad' : ''}" placeholder="find" spellcheck="false" value="${esc(r.find)}"><span class="rarrow">→</span><input class="rrep" placeholder="replace" spellcheck="false" value="${esc(r.repl)}"><button class="mini rdel" title="Delete">×</button></div>`).join('');
    }
    function rebuildFromRules() { store.set('lpd_rules', rules); initialProcess(); updateUI(); }
    $('ruleList').addEventListener('input', (e) => {
        const row = e.target.closest('.rrow'); if (!row) return;
        const r = rules[parseInt(row.dataset.i)];
        if (e.target.classList.contains('rfind')) { r.find = e.target.value; e.target.classList.toggle('bad', compileRule(r) === false); }
        else r.repl = e.target.value;
        rebuildFromRules();
    });
    $('ruleList').addEventListener('click', (e) => {
        const row = e.target.closest('.rrow'); if (!row) return;
        const i = parseInt(row.dataset.i);
        if (e.target.closest('.rtog')) rules[i].on = !rules[i].on;
        else if (e.target.closest('.rdel')) rules.splice(i, 1);
        else return;
        renderRules(); rebuildFromRules();
    });
    $('ruleAdd').onclick = () => {
        rules.push({ on: true, find: '', repl: '' }); store.set('lpd_rules', rules); renderRules();
        const f = $('ruleList').querySelectorAll('.rfind'); if (f.length) f[f.length - 1].focus();
    };
    $('rulesBtn').onclick = (e) => { togglePop('rulesPop', 'rulesBtn'); e.currentTarget.blur(); };

    // --- INIT ---
    (function init() {
        ['lpd_bul', 'lpd_newsmode', 'lpd_newscache', 'lpd_chunks'].forEach(k => localStorage.removeItem(k));
        $('textInput').value = store.get('lpd_text', '');
        initialProcess();
        renderKeys(); applyOpts(); renderRules();
        renderAnalysis(); updateStats();
    })();
</script>
</body>
</html>
